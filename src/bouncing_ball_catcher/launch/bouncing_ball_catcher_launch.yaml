launch:
  - arg:
      name: "source"
      default: "0"
  - arg:
      name: "fps"
      default: "30.0"
  - arg:
      name: "width"
      default: "640"
  - arg:
      name: "height"
      default: "480"

  - node:
      pkg: "bouncing_ball_catcher"
      exec: "camera_node"
      name: "camera_node"
      output: "screen"
      emulate_tty: true
      param:
      -
        name: "source"
        value: "$(var source)"
        type: "str"
      -
        name: "fps"
        value: "$(var fps)"
        type: "float"
      -
        name: "width"
        value: "$(var width)"
        type: "int"
      -
        name: "height"
        value: "$(var height)"
        type: "int"